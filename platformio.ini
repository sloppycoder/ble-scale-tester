[env:m5stack_atoms3r]
platform = espressif32@6.12.0
; No dedicated PlatformIO board id for AtomS3R yet; it's the same
; ESP32-S3-PICO-1-N8R8 / native-USB-CDC layout as AtomS3 (just +8MB OPI
; PSRAM, which this BLE-only test doesn't need), so the AtomS3 board
; profile matches it electrically. https://docs.m5stack.com/en/core/AtomS3R
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    -std=c++17
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
monitor_filters =
    esp32_exception_decoder
    time
    default
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.0
    symlink://../esp-arduino-ble-scales
