[env:m5stack_atoms3r]
platform = espressif32@6.12.0
; No dedicated PlatformIO board id for AtomS3R yet; it's the same
; ESP32-S3-PICO-1-N8R8 / native-USB-CDC layout as AtomS3 (just +8MB OPI
; PSRAM, which this BLE-only test doesn't need), so the AtomS3 board
; profile matches it electrically. https://docs.m5stack.com/en/core/AtomS3R
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    -std=c++17
    -std=gnu++17
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; Same NimBLE-Arduino config flags as gaggimate's [display_common].
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
monitor_filters =
    esp32_exception_decoder
    time
    default
; Matches gaggimate master: espressif32@6.12.0 + NimBLE-Arduino 1.4.x + C++17.
; The scales library is the sibling checkout, which must be on the v1.x line
; (the branch gaggimate's scale-library tags come from). v1.x has no
; library.json, so symlink:// deps fail; lib_links/ holds a symlink that
; lib_extra_dirs picks up instead.
lib_extra_dirs = lib_links
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    m5stack/M5Unified@^0.2.22
